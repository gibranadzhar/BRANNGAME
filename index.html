<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRANNGAME - Direct Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05050a; overflow: hidden; }
        canvas { border: 2px solid #00f0ff; background: #0b0b16; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen font-mono text-white p-4 select-none">

    <div id="game-layer" class="flex flex-col items-center justify-center w-full">
        
        <div id="menu-screen" class="flex flex-col items-center justify-center p-4">
            <h1 class="text-5xl font-black text-[#00f0ff] tracking-widest mb-1 shadow-[0_0_15px_#00f0ff] uppercase text-center">BRANNGAME</h1>
            <div class="flex items-center gap-2 mb-6 justify-center">
                <p id="user-badge" class="text-xs bg-red-600 border border-red-400 px-3 py-0.5 rounded text-white uppercase tracking-widest font-black shadow-[0_0_10px_#ff0000]">⚡ SUPER ADMIN ⚡</p>
            </div>
            
            <div class="mb-6 bg-[#121225] border border-yellow-500/50 px-6 py-2 rounded-full flex items-center gap-2 text-xl font-bold text-yellow-400 shadow-[0_0_10px_rgba(234,179,8,0.2)]">
                🪙 COINS: <span id="menu-coins">0</span>
            </div>

            <div class="flex flex-col gap-3 w-64">
                <button onclick="openGarage()" class="bg-purple-600/30 border border-purple-500 hover:bg-purple-600 text-white font-bold py-3 rounded-lg transition uppercase tracking-wider mb-2 shadow-[0_0_10px_rgba(168,85,247,0.3)] cursor-pointer">🛠️ GARAGE / SHOP</button>
                <button onclick="startGame('easy')" class="bg-green-500/20 border border-green-500 hover:bg-green-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🟢 Play Easy</button>
                <button onclick="startGame('medium')" class="bg-yellow-500/20 border border-yellow-500 hover:bg-yellow-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🟡 Play Medium</button>
                <button onclick="startGame('hard')" class="bg-orange-500/20 border border-orange-500 hover:bg-orange-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🟠 Play Hard</button>
                <button onclick="startGame('extreme')" class="bg-red-500/20 border border-red-500 hover:bg-red-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🔴 Play EXTREME</button>
            </div>
        </div>

        <div id="garage-screen" class="hidden flex flex-col items-center justify-center p-4">
            <h2 class="text-3xl font-black text-purple-400 tracking-widest mb-2 uppercase">HANGAR / GARAGE</h2>
            <div class="mb-6 text-yellow-400 font-bold text-lg">YOUR WALLET: 🪙 <span id="garage-coins">0</span></div>
            
            <div class="flex flex-col gap-4 w-80 max-h-[320px] overflow-y-auto mb-6 px-2">
                <div class="bg-[#121225] border border-blue-500 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-blue-400">🔵 Default Fighter</h3>
                        <p class="text-xs text-zinc-400">Stats: Standard Ship</p>
                    </div>
                    <button id="btn-ship-0" onclick="selectShip(0)" class="bg-blue-600 text-xs px-4 py-2 font-bold rounded-lg uppercase cursor-pointer">EQUIP</button>
                </div>
                <div class="bg-[#121225] border border-green-500 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-green-400">🟢 Venom Phantom</h3>
                        <p class="text-xs text-zinc-400">Stats: Extra Speed</p>
                    </div>
                    <button id="btn-ship-1" onclick="selectShip(1)" class="bg-zinc-700 text-xs px-3 py-2 font-bold rounded-lg text-yellow-400 cursor-pointer">🪙 100</button>
                </div>
                <div class="bg-[#121225] border border-red-500 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-red-500">🔥 Hellfire Apex</h3>
                        <p class="text-xs text-zinc-400">Stats: Hyper Fast Auto-Shoot</p>
                    </div>
                    <button id="btn-ship-2" onclick="selectShip(2)" class="bg-zinc-700 text-xs px-3 py-2 font-bold rounded-lg text-yellow-400 cursor-pointer">🪙 250</button>
                </div>
            </div>
            <button onclick="closeGarage()" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 px-8 rounded-lg text-sm tracking-wide transition uppercase cursor-pointer">🔙 BACK TO MENU</button>
        </div>

        <div id="gameplay-area" class="hidden flex flex-col items-center">
            <div class="w-[400px] flex flex-col gap-1 mb-2 px-2">
                <div class="flex justify-between items-center text-sm">
                    <div>SCORE: <span id="score-text" class="text-[#00f0ff] font-bold">0</span></div>
                    <div>🪙: <span id="coin-text" class="text-yellow-400 font-bold">0</span></div>
                    <div>WAVE: <span id="wave-text" class="text-purple-400 font-bold">1</span></div>
                    <div>HP: <span id="hp-text" class="text-[#ff007f] font-bold">3</span></div>
                </div>
                <div id="boss-hp-container" class="w-full bg-zinc-800 h-3 rounded-full mt-1 border border-red-500 hidden overflow-hidden shadow-[0_0_10px_rgba(239,68,68,0.5)]">
                    <div id="boss-hp-bar" class="bg-red-600 h-full w-full transition-all duration-75"></div>
                </div>
            </div>

            <canvas id="gameCanvas" width="400" height="500"></canvas>

            <div class="flex gap-12 mt-4 md:hidden w-[400px] justify-center">
                <button id="btn-left" class="bg-[#121225] border border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-20 h-16 rounded-xl text-2xl font-bold flex items-center justify-center cursor-pointer">◀</button>
                <button id="btn-right" class="bg-[#121225] border border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-20 h-16 rounded-xl text-2xl font-bold flex items-center justify-center cursor-pointer">▶</button>
            </div>
        </div>

        <div id="game-over" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-50">
            <h1 id="end-title" class="text-4xl font-black text-[#ff007f] tracking-widest mb-2">MISSION FAILED</h1>
            <p id="final-score" class="text-xl text-zinc-400 mb-1">Skor Akhir: 0</p>
            <p id="final-coins" class="text-lg text-yellow-400 font-bold mb-6">Koin Didapat: +0</p>
            <button onclick="backToMenu()" class="bg-[#00f0ff] hover:bg-[#00c8d7] text-black font-black py-3 px-8 rounded-lg transition-all shadow-[0_0_15px_#00f0ff] uppercase cursor-pointer">
                RETURN TO BASE 🔄
            </button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Otomatis Admin Mode Aktif & Semua Pesawat Terbuka
        let totalCoins = 9999; 
        let ownedShips = [true, true, true]; 
        let activeShipIndex = 0; 

        const shipTemplates = [
            { name: "Default Fighter", speed: 6.0, shootSpeed: 280, color: '#00f0ff' },
            { name: "Venom Phantom", speed: 8.5, shootSpeed: 260, color: '#00ff66' },
            { name: "Hellfire Apex", speed: 6.5, shootSpeed: 180, color: '#ff3333' }
        ];

        let player = { x: 180, y: 440, width: 40, height: 30, speed: 6 };
        let bullets = []; let enemies = []; let enemyBullets = []; let items = []; let particles = [];
        let boss = { x: 150, y: -100, width: 100, height: 50, hp: 100, maxHp: 100, speed: 2, direction: 1, active: false };
        
        let score = 0; let sessionCoins = 0; let hp = 3; let weaponLevel = 1;
        let currentWave = 1; let waveKills = 0; let gameOver = false; let gameActive = false;
        let isShielded = false; let shieldTimer = 0;
        
        let keys = {}; let enemySpeedModifier = 1; let spawnInterval = 1200;
        let lastSpawn = 0; let lastShot = 0; let lastBossShot = 0; let shootSpeed = 280;

        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        let activeMove = null;
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'left'; });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'right'; });
        window.addEventListener('touchend', () => activeMove = null);

        // Langsung tampilkan koin di awal load
        document.getElementById('menu-coins').innerText = totalCoins;

        function openGarage() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('garage-coins').innerText = totalCoins;
            updateGarageButtons();
            document.getElementById('garage-screen').classList.remove('hidden');
        }

        function closeGarage() {
            document.getElementById('garage-screen').classList.add('hidden');
            document.getElementById('menu-coins').innerText = totalCoins;
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function updateGarageButtons() {
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`btn-ship-${i}`);
                if (activeShipIndex === i) {
                    btn.innerText = "ACTIVE";
                    btn.className = "bg-green-600 text-xs px-3 py-2 font-bold rounded-lg text-white border border-white";
                } else {
                    btn.innerText = "EQUIP";
                    btn.className = "bg-blue-600 hover:bg-blue-500 text-xs px-4 py-2 font-bold rounded-lg text-white";
                }
            }
        }

        function selectShip(index) {
            activeShipIndex = index;
            updateGarageButtons();
            triggerVibrate(100);
        }

        function startGame(difficulty) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('gameplay-area').classList.remove('hidden');
            
            const currentShipConfig = shipTemplates[activeShipIndex];
            player.speed = currentShipConfig.speed;
            shootSpeed = currentShipConfig.shootSpeed;

            if (difficulty === 'easy') {
                hp = 4; enemySpeedModifier = 1.1; spawnInterval = 1300; boss.maxHp = 60;
            } else if (difficulty === 'medium') {
                hp = 3; enemySpeedModifier = 1.8; spawnInterval = 1000; boss.maxHp = 120;
            } else if (difficulty === 'hard') {
                hp = 2; enemySpeedModifier = 2.5; spawnInterval = 800; boss.maxHp = 200;
            } else if (difficulty === 'extreme') {
                hp = 1; enemySpeedModifier = 3.5; spawnInterval = 500; boss.maxHp = 350;
            }

            score = 0; sessionCoins = 0; weaponLevel = 1; currentWave = 1; waveKills = 0;
            isShielded = false; bullets = []; enemies = []; enemyBullets = []; items = []; particles = [];
            
            boss.hp = boss.maxHp; boss.x = 150; boss.y = -100; boss.active = false;
            player.x = 180; gameOver = false; gameActive = true;

            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1, alpha: 1,
                    decay: Math.random() * 0.03 + 0.01, color: color
                });
            }
        }

        function autoShoot(timestamp) {
            if (timestamp - lastShot > shootSpeed) {
                if (weaponLevel === 1) {
                    bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 12, speed: 9 });
                } else if (weaponLevel === 2) {
                    bullets.push({ x: player.x + 5, y: player.y + 10, width: 4, height: 12, speed: 9 });
                    bullets.push({ x: player.x + player.width - 9, y: player.y + 10, width: 4, height: 12, speed: 9 });
                } else if (weaponLevel >= 3) {
                    bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 12, speed: 9 });
                    bullets.push({ x: player.x + 2, y: player.y + 10, width: 4, height: 12, speed: 9 });
                    bullets.push({ x: player.x + player.width - 6, y: player.y + 10, width: 4, height: 12, speed: 9 });
                }
                lastShot = timestamp;
            }
        }

        function spawnEnemy(timestamp) {
            if (boss.active || currentWave > 2) return;
            if (timestamp - lastSpawn > spawnInterval) {
                let size = Math.random() * 20 + 20;
                enemies.push({
                    x: Math.random() * (canvas.width - size), y: -size,
                    width: size, height: size,
                    speed: (Math.random() * 1.5 + 1) * enemySpeedModifier
                });
                lastSpawn = timestamp;
            }
        }

        function update(timestamp) {
            if (gameOver || !gameActive) return;

            if (keys['ArrowLeft'] || keys['KeyA'] || activeMove === 'left') { if (player.x > 0) player.x -= player.speed; }
            if (keys['ArrowRight'] || keys['KeyD'] || activeMove === 'right') { if (player.x < canvas.width - player.width) player.x += player.speed; }
