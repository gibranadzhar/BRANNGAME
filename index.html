<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Trivia Game</title>
    <!-- Menggunakan Tailwind CSS untuk desain instan -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a12] text-white font-mono flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Box Utama Game (Cyberpunk Card) -->
    <div class="bg-[#121225] border-2 border-[#00f0ff] p-8 rounded-xl shadow-[0_0_20px_rgba(0,240,255,0.3)] max-w-md w-full text-center">
        
        <!-- Header Game -->
        <h1 class="text-2xl font-bold tracking-widest text-[#ff007f] uppercase mb-2 shadow-sm">⚡ Cyber Trivia ⚡</h1>
        <p id="progress" class="text-xs text-zinc-500 mb-6">Pertanyaan 1 dari 3</p>

        <!-- Area Pertanyaan -->
        <div class="min-h-[80px] flex items-center justify-center mb-6">
            <h2 id="question" class="text-lg font-semibold text-zinc-200">Loading pertanyaan...</h2>
        </div>

        <!-- Tombol Pilihan Jawaban -->
        <div class="flex flex-col gap-3" id="options-container">
            <!-- Tombol akan muncul di sini secara otomatis melalui JavaScript -->
        </div>

        <!-- Tombol Next (Sembunyikan dulu di awal) -->
        <button id="next-btn" onclick="nextQuestion()" class="hidden mt-6 w-full bg-[#00f0ff] hover:bg-[#00c8d7] text-black font-bold py-3 px-6 rounded-lg transition duration-200 uppercase tracking-wider">
            Lanjut ⏭
        </button>

        <!-- Layar Skor Akhir (Sembunyikan dulu di awal) -->
        <div id="score-screen" class="hidden">
            <h2 class="text-2xl font-bold text-[#00f0ff] mb-2">Game Over!</h2>
            <p id="final-score" class="text-xl text-zinc-300 mb-6">Kamu benar 0 dari 0</p>
            <button onclick="restartGame()" class="w-full bg-[#ff007f] hover:bg-[#d6006a] text-white font-bold py-3 px-6 rounded-lg transition duration-200 uppercase tracking-wider">
                Main Lagi 🔄
            </button>
        </div>
    </div>

    <script>
        // 1. Bank Data Pertanyaan (Bisa kamu ganti atau tambah sesukamu!)
        const questions = [
            {
                q: "Senjata apa yang paling ikonik di game Free Fire karena bisa ditaruh di slot pistol tapi rasanya kayak shotgun?",
                options: ["M1887", "MAG-7", "M1014", "Mini Uzi"],
                answer: "Mini Uzi"
            },
            {
                q: "Bahasa Sundanya 'Jangan lupa makan' yang santai atau agak kasar/akrab adalah...",
                options: ["Tong hilap tuang", "Ulah hilap dahar", "Tong khilaf dahar", "Tong poho baranghakan"],
                answer: "Tong poho baranghakan"
            },
            {
                q: "Siapakah pendiri sekaligus CEO dari platform game Roblox?",
                options: ["David Baszucki", "Erik Cassel", "Builderman", "John Shedletsky"],
                answer: "David Baszucki"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const nextButton = document.getElementById('next-btn');
        const progressElement = document.getElementById('progress');
        const scoreScreen = document.getElementById('score-screen');

        // 2. Fungsi Memulai Game
        function startGame() {
            currentQuestionIndex = 0;
            score = 0;
            scoreScreen.classList.add('hidden');
            nextButton.classList.add('hidden');
            optionsContainer.classList.remove('hidden');
            questionElement.classList.remove('hidden');
            progressElement.classList.remove('hidden');
            showQuestion();
        }

        // 3. Fungsi Menampilkan Pertanyaan
        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            progressElement.innerText = `Pertanyaan ${currentQuestionIndex + 1} dari ${questions.length}`;
            questionElement.innerText = currentQuestion.q;

            // Bikin tombol untuk setiap pilihan jawaban
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option;
                // Desain tombol bawaan
                button.className = "w-full text-left p-3 rounded-lg border border-zinc-700 bg-[#161630] hover:border-[#ff007f] transition duration-150";
                button.addEventListener('click', () => selectAnswer(button, option, currentQuestion.answer));
                optionsContainer.appendChild(button);
            });
        }

        // 4. Fungsi Reset Tombol Sebelum Pertanyaan Baru
        function resetState() {
            nextButton.classList.add('hidden');
            optionsContainer.innerHTML = '';
        }

        // 5. Fungsi Ketika Player Memilih Jawaban
        function selectAnswer(selectedButton, chosenOption, correctAnswer) {
            // Matikan semua tombol biar gak bisa diklik dua kali
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);

            if (chosenOption === correctAnswer) {
                score++;
                selectedButton.className = "w-full text-left p-3 rounded-lg border-2 border-green-500 bg-green-950/50 text-green-300 font-bold shadow-[0_0_10px_rgba(34,197,94,0.3)]";
            } else {
                selectedButton.className = "w-full text-left p-3 rounded-lg border-2 border-red-500 bg-red-950/50 text-red-300 font-bold shadow-[0_0_10px_rgba(239,68,68,0.3)]";
                
                // Tunjukkan jawaban yang benar mana
                allButtons.forEach(btn => {
                    if (btn.innerText === correctAnswer) {
                        btn.className = "w-full text-left p-3 rounded-lg border border-green-500 bg-green-950/20 text-green-400";
                    }
                });
            }
            nextButton.classList.remove('hidden');
        }

        // 6. Fungsi Tombol Lanjut
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showScore();
            }
        }

        // 7. Menampilkan Skor Akhir
        function showScore() {
            resetState();
            questionElement.classList.add('hidden');
            progressElement.classList.add('hidden');
            optionsContainer.classList.add('hidden');
            
            scoreScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = `Skor kamu: ${score} dari ${questions.length} benar!`;
        }

        function restartGame() {
            startGame();
        }

        // Jalankan pertama kali saat halaman dibuka
        startGame();
    </script>
</body>
</html>
