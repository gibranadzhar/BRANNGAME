<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRANNGAME - Live Flight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05050a; overflow: hidden; touch-action: none; }
        canvas { border: 2px solid #00f0ff; background: #0b0b16; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen font-mono text-white p-2 select-none">

    <div class="w-[360px] flex justify-between items-center text-xs mb-2 px-1 tracking-widest text-[#00f0ff]">
        <div>SCORE: <span id="score-text" class="font-bold text-white">0</span></div>
        <div>WAVE: <span id="wave-text" class="font-bold text-purple-400">1</span></div>
        <div>HP: <span id="hp-text" class="font-bold text-red-500">3</span></div>
    </div>

    <canvas id="gameCanvas" width="360" height="460"></canvas>

    <div class="flex gap-16 mt-4 w-[360px] justify-center">
        <button id="btn-left" class="bg-[#121225] border-2 border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-24 h-16 rounded-xl text-2xl font-black flex items-center justify-center cursor-pointer">◀</button>
        <button id="btn-right" class="bg-[#121225] border-2 border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-24 h-16 rounded-xl text-2xl font-black flex items-center justify-center cursor-pointer">▶</button>
    </div>

    <div id="game-over" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
        <h1 class="text-3xl font-black text-red-500 tracking-wider mb-2">GAME OVER</h1>
        <p id="final-score" class="text-sm text-zinc-400 mb-6">Skor Kamu: 0</p>
        <button onclick="resetGame()" class="bg-[#00f0ff] text-black font-black py-3 px-8 rounded-lg shadow-[0_0_15px_#00f0ff] uppercase cursor-pointer">
            TERBANG LAGI 🔄
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Struktur Data Player (Pesawat Segitiga Cyan)
        let player = { x: 160, y: 390, width: 40, height: 30, speed: 7 };
        
        // Array Penyimpanan Objek Game
        let bullets = [];
        let enemies = [];
        let particles = [];
        
        // Aturan Dasar Game
        let score = 0;
        let hp = 3;
        let currentWave = 1;
        let waveKills = 0;
        let gameOver = false;
        
        let lastShot = 0;
        let lastSpawn = 0;
        let keys = {};
        let activeMove = null;

        // Kontrol Keyboard (PC/Laptop)
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Kontrol Sentuh Bergerak Instan (HP)
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'left'; });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'right'; });
        window.addEventListener('touchend', () => activeMove = null);

        // Kontrol Alternatif Klik Mouse (Tes di browser PC pakai mouse)
        btnLeft.addEventListener('mousedown', () => activeMove = 'left');
        btnRight.addEventListener('mousedown', () => activeMove = 'right');
        window.addEventListener('mouseup', () => activeMove = null);

        // Fungsi Otomatis Memulai Game saat Halaman Terbuka
        function init() {
            score = 0;
            hp = 3;
            currentWave = 1;
            waveKills = 0;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = 160;
            gameOver = false;
            
            document.getElementById('game-over').classList.add('hidden');
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('score-text').innerText = score;
            document.getElementById('hp-text').innerText = hp;
            document.getElementById('wave-text').innerText = currentWave;
        }

        // Logika Mekanik Gerakan, Peluru, dan Musuh
        function update(timestamp) {
            if (gameOver) return;

            // Membaca input pergerakan pesawat
            if (keys['ArrowLeft'] || keys['KeyA'] || activeMove === 'left') {
                if (player.x > 0) player.x -= player.speed;
            }
            if (keys['ArrowRight'] || keys['KeyD'] || activeMove === 'right') {
                if (player.x < canvas.width - player.width) player.x += player.speed;
            }

            // Sistem Tembak Otomatis (Auto-Shoot tiap 250ms)
            if (timestamp - lastShot > 250) {
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 12, speed: 8 });
                lastShot = timestamp;
            }

            // Gerakan Peluru Ke Atas
            bullets.forEach((bullet, index) => {
                bullet.y -= bullet.speed;
                if (bullet.y < 0) bullets.splice(index, 1);
            });

            // Munculkan Musuh Kotak Merah secara berkala
            let spawnDelay = currentWave === 1 ? 1200 : 800;
            if (timestamp - lastSpawn > spawnDelay) {
                enemies.push({
                    x: Math.random() * (canvas.width - 25),
                    y: -25, width: 25, height: 25,
                    speed: Math.random() * 2 + (currentWave * 1.2)
                });
                lastSpawn = timestamp;
            }

            // Pergerakan Musuh Ke Bawah
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                // Jika musuh lolos sampai batas bawah, nyawa berkurang
                if (enemy.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                    hp--;
                    updateHUD();
                }

                // Cek tabrakan antara Pesawat Player dengan Musuh
                if (checkCollision(player, enemy)) {
                    enemies.splice(eIndex, 1);
                    hp--;
                    createExplosion(enemy.x, enemy.y, '#ff0055');
                    updateHUD();
                }

                // Cek peluru mengenai musuh
                bullets.forEach((bullet, bIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        createExplosion(enemy.x + 12, enemy.y + 12, '#ff007f');
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        waveKills++;

                        // Naik Tingkat Kesulitan setelah hancurkan 15 musuh
                        if (waveKills >= 15 && currentWave === 1) {
                            currentWave = 2;
                        }
                        updateHUD();
                    }
                });
            });

            // Update partikel ledakan hancur
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            // Kondisi Kalah Game Over
            if (hp <= 0) {
                gameOver = true;
                document.getElementById('final-score').innerText = `Skor Kamu: ${score} Poin`;
                document.getElementById('game-over').classList.remove('hidden');
            }
        }

        // Render Gambar Grafik Objek di Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Efek Partikel Ledakan
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Gambar Pesawat Player (Berbentuk Segitiga Neon Cyan)
            ctx.fillStyle = '#00f0ff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Gambar Peluru Laser Biru
            ctx.fillStyle = '#00ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 5;
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Gambar Musuh Alien Kotak Merah
            ctx.fillStyle = '#ff3366';
            ctx.shadowColor = '#ff3366';
            ctx.shadowBlur = 8;
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));

            ctx.shadowBlur = 0; // Reset shadow biar tidak berat
        }

        // Hitung matematika tabrakan kotak persegi
        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height && r1.y + r1.height > r2.y;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 1,
                    alpha: 1, color: color
                });
            }
        }

        function resetGame() {
            init();
        }

        // Jalankan game saat semua aset siap
        window.onload = init;
    </script>
</body>
</html>
