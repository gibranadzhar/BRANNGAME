<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRANNGAME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05050a; overflow: hidden; touch-action: manipulation; }
        canvas { border: 2px solid #00f0ff; background: #0b0b16; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen font-mono text-white p-4 select-none">

    <div id="menu-screen" class="flex flex-col items-center justify-center p-4">
        <h1 class="text-5xl font-black text-[#00f0ff] tracking-widest mb-1 shadow-[0_0_15px_#00f0ff] uppercase text-center">BRANNGAME</h1>
        <div class="flex items-center gap-2 mb-6 justify-center">
            <p class="text-xs bg-red-600 border border-red-400 px-3 py-0.5 rounded text-white uppercase tracking-widest font-black shadow-[0_0_10px_#ff0000]">⚡ SUPER ADMIN ⚡</p>
        </div>
        
        <div class="mb-6 bg-[#121225] border border-yellow-500/50 px-6 py-2 rounded-full flex items-center gap-2 text-xl font-bold text-yellow-400 shadow-[0_0_10px_rgba(234,179,8,0.2)]">
            🪙 COINS: <span id="menu-coins">9999</span>
        </div>

        <div class="flex flex-col gap-3 w-64">
            <button onclick="startGame('easy')" class="bg-green-500/20 border border-green-500 hover:bg-green-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🟢 Play Easy</button>
            <button onclick="startGame('medium')" class="bg-yellow-500/20 border border-yellow-500 hover:bg-yellow-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🟡 Play Medium</button>
            <button onclick="startGame('hard')" class="bg-orange-500/20 border border-orange-500 hover:bg-orange-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🟠 Play Hard</button>
            <button onclick="startGame('extreme')" class="bg-red-500/20 border border-red-500 hover:bg-red-500 hover:text-black font-bold py-2 rounded-lg transition uppercase tracking-wider text-sm cursor-pointer">🔴 Play EXTREME</button>
        </div>
    </div>

    <div id="gameplay-area" class="hidden flex flex-col items-center">
        <div class="w-[360px] flex justify-between items-center text-xs mb-2 px-1 tracking-wider text-[#00f0ff]">
            <div>SCORE: <span id="score-text" class="text-white font-bold">0</span></div>
            <div>WAVE: <span id="wave-text" class="text-purple-400 font-bold">1</span></div>
            <div>HP: <span id="hp-text" class="text-red-500 font-bold">3</span></div>
        </div>

        <canvas id="gameCanvas" width="360" height="460"></canvas>

        <div class="flex gap-16 mt-4 w-[360px] justify-center">
            <button id="btn-left" class="bg-[#121225] border-2 border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-24 h-16 rounded-xl text-2xl font-black flex items-center justify-center cursor-pointer">◀</button>
            <button id="btn-right" class="bg-[#121225] border-2 border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-24 h-16 rounded-xl text-2xl font-black flex items-center justify-center cursor-pointer">▶</button>
        </div>
    </div>

    <div id="game-over" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-50">
        <h1 class="text-4xl font-black text-[#ff007f] tracking-widest mb-2">MISSION FAILED</h1>
        <p id="final-score" class="text-xl text-zinc-400 mb-6">Skor Akhir: 0</p>
        <button onclick="backToMenu()" class="bg-[#00f0ff] text-black font-black py-3 px-8 rounded-lg shadow-[0_0_15px_#00f0ff] uppercase cursor-pointer">
            RETURN TO BASE 🔄
        </button>
    </div>

    <script>
        // Ambil elemen kanvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Setup dasar objek player & musuh
        let player = { x: 160, y: 390, width: 40, height: 30, speed: 6 };
        let bullets = []; 
        let enemies = []; 
        let particles = [];

        // Aturan data game angka nilai
        let score = 0; 
        let hp = 3; 
        let currentWave = 1; 
        let waveKills = 0; 
        let gameOver = false; 
        let gameActive = false;

        let lastShot = 0; 
        let lastSpawn = 0; 
        let enemySpeedModifier = 1; 
        let spawnInterval = 1200;
        let keys = {}; 
        let activeMove = null;

        // Pasang Event Keyboard PC langsung di awal script seperti versi aslimu
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Pasang Event Sentuh Tombol HP langsung di awal script
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        if (btnLeft && btnRight) {
            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'left'; });
            btnLeft.addEventListener('mousedown', () => { activeMove = 'left'; });

            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'right'; });
            btnRight.addEventListener('mousedown', () => { activeMove = 'right'; });

            window.addEventListener('touchend', () => activeMove = null);
            window.addEventListener('mouseup', () => activeMove = null);
        }

        // Fungsi klik tombol Play Tingkat Kesulitan
        function startGame(difficulty) {
            // Sembunyikan menu, munculkan area gameplay
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('gameplay-area').classList.remove('hidden');

            // Seting variabel tingkat kesulitan musuh
            if (difficulty === 'easy') {
                hp = 4; enemySpeedModifier = 1.1; spawnInterval = 1300;
            } else if (difficulty === 'medium') {
                hp = 3; enemySpeedModifier = 1.7; spawnInterval = 1000;
            } else if (difficulty === 'hard') {
                hp = 2; enemySpeedModifier = 2.4; spawnInterval = 800;
            } else if (difficulty === 'extreme') {
                hp = 1; enemySpeedModifier = 3.3; spawnInterval = 550;
            }

            // Reset ulang data state game awal mula
            score = 0; currentWave = 1; waveKills = 0;
            bullets = []; enemies = []; particles = [];
            player.x = 160; 
            gameOver = false; 
            gameActive = true;

            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 2 + 1, alpha: 1, color: color
                });
            }
        }

        function update(timestamp) {
            if (gameOver || !gameActive) return;

            // Logika gerak pesawat kiri kanan
            if (keys['ArrowLeft'] || keys['KeyA'] || activeMove === 'left') { 
                if (player.x > 0) player.x -= player.speed; 
            }
            if (keys['ArrowRight'] || keys['KeyD'] || activeMove === 'right') { 
                if (player.x < canvas.width - player.width) player.x += player.speed; 
            }

            // Sistem tembak laser otomatis (setiap 260ms)
            if (timestamp - lastShot > 260) {
                bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 12, speed: 9 });
                lastShot = timestamp;
            }

            // Gerakan jalannya peluru
            bullets.forEach((bullet, bIndex) => {
                bullet.y -= bullet.speed;
                if (bullet.y < 0) bullets.splice(bIndex, 1);
            });

            // Sistem spawn musuh alien berkala
            if (timestamp - lastSpawn > spawnInterval) {
                let size = Math.random() * 15 + 20;
                enemies.push({
                    x: Math.random() * (canvas.width - size), y: -size,
                    width: size, height: size,
                    speed: (Math.random() * 1.5 + 1) * enemySpeedModifier
                });
                lastSpawn = timestamp;
            }

            // Gerakan musuh & deteksi tabrakan laser hancur
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;
                if (enemy.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                    hp--; updateHUD();
                }

                if (checkCollision(player, enemy)) {
                    enemies.splice(eIndex, 1);
                    createExplosion(enemy.x, enemy.y, '#ff007f');
                    hp--; updateHUD();
                }

                bullets.forEach((bullet, bIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff007f');
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10; waveKills++;

                        if (waveKills >= 15) {
                            currentWave++; waveKills = 0;
                        }
                        updateHUD();
                    }
                });
            });

            // Update memudar hilangnya partikel ledakan hancur
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            if (hp <= 0) {
                gameOver = true;
                document.getElementById('final-score').innerText = `Skor Akhir: ${score} Poin`;
                document.getElementById('game-over').classList.remove('hidden');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!gameActive) return;

            // Gambar partikel
            particles.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });

            // Gambar segitiga pesawat player neon cyan
            ctx.fillStyle = '#00f0ff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath(); ctx.fill();

            // Gambar laser biru tembakan peluru
            ctx.fillStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 5;
            bullets.forEach(bullet => ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height));

            // Gambar kotak musuh pink kemerahan
            ctx.fillStyle = '#ff007f'; ctx.shadowColor = '#ff007f'; ctx.shadowBlur = 8;
            enemies.forEach(enemy => ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height));

            ctx.shadowBlur = 0; 
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
        }

        function updateHUD() {
            document.getElementById('score-text').innerText = score;
            document.getElementById('hp-text').innerText = hp;
            document.getElementById('wave-text').innerText = currentWave;
        }

        function backToMenu() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('gameplay-area').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            gameActive = false;
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            if (!gameOver && gameActive) requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
