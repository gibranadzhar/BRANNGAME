<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Space Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05050a; overflow: hidden; }
        canvas { border: 2px solid #00f0ff; background: #0b0b16; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen font-mono text-white p-4 select-none">

    <div class="w-[400px] flex justify-between items-center mb-2 px-2">
        <div>SCORE: <span id="score-text" class="text-[#00f0ff] font-bold">0</span></div>
        <div>HP: <span id="hp-text" class="text-[#ff007f] font-bold">3</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <div class="flex gap-8 mt-4 md:hidden w-[400px] justify-center">
        <button id="btn-left" class="bg-[#121225] border border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-16 h-16 rounded-full text-2xl font-bold flex items-center justify-center">◀</button>
        <button id="btn-shoot" class="bg-[#ff007f] active:bg-[#ff55a5] w-20 h-16 rounded-xl text-md font-black tracking-wider flex items-center justify-center text-white shadow-lg">FIRE</button>
        <button id="btn-right" class="bg-[#121225] border border-[#00f0ff] active:bg-[#00f0ff] active:text-black w-16 h-16 rounded-full text-2xl font-bold flex items-center justify-center">▶</button>
    </div>

    <div class="text-xs text-zinc-500 mt-2 hidden md:block">
        Gunakan tombol <span class="text-white">Panah Kiri / Kanan</span> untuk bergerak, dan <span class="text-white">Spasi</span> untuk Menembak!
    </div>

    <div id="game-over" class="hidden absolute inset-0 bg-black/95 flex flex-col items-center justify-center z-20">
        <h1 class="text-4xl font-black text-[#ff007f] tracking-widest mb-2 animate-pulse">MISSION FAILED</h1>
        <p id="final-score" class="text-xl text-zinc-400 mb-6">Skor Akhir: 0</p>
        <button onclick="resetGame()" class="bg-[#00f0ff] hover:bg-[#00c8d7] text-black font-black py-3 px-8 rounded-lg transition-all shadow-[0_0_15px_#00f0ff] uppercase">
            REDEPLOY 🔄
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // State Game
        let player = { x: 180, y: 440, width: 40, height: 30, speed: 6 };
        let bullets = [];
        let enemies = [];
        let score = 0;
        let hp = 3;
        let gameOver = false;
        let keys = {};
        let spawnInterval = 1200; // Tempo munculnya musuh (ms)
        let lastSpawn = 0;

        // Deteksi Keyboard untuk PC
        window.addEventListener('keydown', (e) => { keys[e.code] = true; if(e.code === "Space") shootBullet(); });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Deteksi Tombol untuk HP
        let activeMove = null;
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'left'; });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); activeMove = 'right'; });
        document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shootBullet(); });
        window.addEventListener('touchend', () => activeMove = null);

        function shootBullet() {
            if (gameOver) return;
            bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 12, speed: 7 });
        }

        function spawnEnemy(timestamp) {
            if (timestamp - lastSpawn > spawnInterval) {
                let size = Math.random() * 20 + 20;
                enemies.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    speed: Math.random() * 2 + 1.5
                });
                lastSpawn = timestamp;
            }
        }

        function update(timestamp) {
            if (gameOver) return;

            // Pergerakan Player (PC & Mobile)
            if (keys['ArrowLeft'] || activeMove === 'left') { if (player.x > 0) player.x -= player.speed; }
            if (keys['ArrowRight'] || activeMove === 'right') { if (player.x < canvas.width - player.width) player.x += player.speed; }

            // Update Peluru
            bullets.forEach((bullet, bIndex) => {
                bullet.y -= bullet.speed;
                if (bullet.y < 0) bullets.splice(bIndex, 1); // Hapus peluru keluar layar
            });

            // Munculkan Musuh
            spawnEnemy(timestamp);

            // Update Posisi Musuh
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                // Jika musuh lolos ke bawah layar
                if (enemy.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                    triggerVibrate(100);
                    hp--;
                    updateHUD();
                }

                // Cek Tabrakan Musuh dengan Player
                if (checkCollision(player, enemy)) {
                    enemies.splice(eIndex, 1);
                    triggerVibrate(300);
                    hp--;
                    updateHUD();
                }

                // Cek Tabrakan Peluru dengan Musuh
                bullets.forEach((bullet, bIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        updateHUD();

                        // Setiap naik 100 poin, musuh makin cepat muncul
                        if (score % 100 === 0 && spawnInterval > 500) spawnInterval -= 100;
                    }
                });
            });

            if (hp <= 0) {
                gameOver = true;
                document.getElementById('final-score').innerText = `Skor Akhir: ${score} Poin`;
                document.getElementById('game-over').classList.remove('hidden');
            }
        }

        // Fungsi menggambar grafis neon di Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Gambar Player (Segitiga Pesawat Neon)
            ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f0ff';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // 2. Gambar Peluru (Garis Neon Hijau)
            ctx.fillStyle = '#00ff66';
            ctx.shadowColor = '#00ff66';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            // 3. Gambar Musuh (Kotak Neon Pink/Magenta)
            ctx.fillStyle = '#ff007f';
            ctx.shadowColor = '#ff007f';
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });

            // Reset efek shadow biar tidak berat
            ctx.shadowBlur = 0;
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updateHUD() {
            document.getElementById('score-text').innerText = score;
            document.getElementById('hp-text').innerText = hp;
        }

        function triggerVibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function resetGame() {
            player.x = 180;
            bullets = [];
            enemies = [];
            score = 0;
            hp = 3;
            spawnInterval = 1200;
            gameOver = false;
            updateHUD();
            document.getElementById('game-over').classList.add('hidden');
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            if (!gameOver) requestAnimationFrame(gameLoop);
        }

        // Mulai Loop Game
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
